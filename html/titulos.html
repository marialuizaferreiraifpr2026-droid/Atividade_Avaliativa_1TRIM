<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title> Elementos &lt;h1&gt; até &lt;h6&gt; </title>
    </head>
    <body>
        <h1>  Sobre os elementos &lt;h1&gt; até &lt;h6&gt; </h1>
        <p> As tags HTML, variando de &lt;h1&gt; a &lt;h6&gt;, 
            são usadas para estruturar e hierarquizar o conteúdo de uma página web, 
            indicando a importância de cada seção.
            Elas vão do mais importante &lt;h1&gt; ao menos importante &lt;h6&gt;. 
        </p>
        
    </body>
</html>
